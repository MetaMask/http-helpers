name: Validate pull request

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.0", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install npm 12
        run: npm install --global npm@12.2.0
      - name: Install dependencies
        run: npm ci
      - name: Check dependency hardening
        run: npx --no-install harden check --package-manager npm
      - name: Check source
        run: npm run check
      - name: Build packages
        run: npm run build
      - name: Check TypeScript projects
        run: npm run typecheck
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run tests
        run: npm run test
      - name: Check release notes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          npm exec -- changeset status --since="origin/${BASE_REF}"
      - name: Preview package archives
        run: npm pack --dry-run --json
